name: riscv64 wheels

on:
  push:
    tags:
      - 'v*-riscv64.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.19.1-riscv64.1)'
        required: true

jobs:
  build:
    name: Build wheel (riscv64)
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          # Install all build-system deps except torch (no riscv64 wheel)
          grep -v "^torch" requirements/build.txt | python -m pip install -r /dev/stdin

      - name: Build wheel (CPU-only, pure-Python riscv64)
        env:
          VLLM_TARGET_DEVICE: cpu
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.19.1"
        run: |
          python -m build --wheel --no-isolation --outdir dist/

      - name: Retag wheel for linux_riscv64
        run: python -m wheel tags --platform-tag linux_riscv64 --remove dist/*.whl

      - name: List built wheels
        run: ls -lh dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: vllm-riscv64-wheel
          path: dist/*.whl
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: vllm-riscv64-wheel
          path: dist/

      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            Unofficial riscv64 CPU-only build of vLLM based on upstream ${{ steps.tag.outputs.name }}.

            **Platform**: linux/riscv64
            **Mode**: pure-Python CPU (no GPU, no C++ extensions)
            **Python**: 3.12

            Install:
            ```bash
            pip install vllm --find-links https://github.com/gounthar/vllm/releases
            ```

            > This is an unofficial community build. See upstream [vllm-project/vllm](https://github.com/vllm-project/vllm) for the canonical project.
          files: dist/*.whl
          prerelease: true
